<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Website Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Website Analyzer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="navbar-text text-white me-3">Welcome, <span id="username"></span></span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2>My Projects</h2>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProjectModal">
                    + Add New Project
                </button>
            </div>
        </div>

        <div id="projects-container" class="row g-4">
            <!-- Projects will be loaded here -->
        </div>

        <div id="no-projects" class="alert alert-info d-none">
            No projects yet. Click "Add New Project" to get started!
        </div>
    </div>

    <!-- Add Project Modal -->
    <div class="modal fade" id="addProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addProjectForm">
                        <div class="mb-3">
                            <label for="projectName" class="form-label">Project Name</label>
                            <input type="text" class="form-control" id="projectName" required>
                        </div>
                        <div class="mb-3">
                            <label for="projectUrl" class="form-label">Website URL</label>
                            <input type="url" class="form-control" id="projectUrl" placeholder="https://example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="projectDescription" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="projectDescription" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addProject()">Add Project</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('access_token');
        
        if (!token) {
            window.location.href = '/login';
        }

        async function fetchWithAuth(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`
            };
            return fetch(url, options);
        }

        async function loadUser() {
            try {
                const response = await fetchWithAuth('/api/auth/me');
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('username').textContent = user.username;
                } else {
                    logout();
                }
            } catch (error) {
                console.error('Error loading user:', error);
                logout();
            }
        }

        async function loadProjects() {
            try {
                const response = await fetchWithAuth('/api/projects');
                if (response.ok) {
                    const projects = await response.json();
                    displayProjects(projects);
                } else {
                    console.error('Failed to load projects');
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        function displayProjects(projects) {
            const container = document.getElementById('projects-container');
            const noProjects = document.getElementById('no-projects');
            
            if (projects.length === 0) {
                container.innerHTML = '';
                noProjects.classList.remove('d-none');
            } else {
                noProjects.classList.add('d-none');
                container.innerHTML = projects.map(project => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow">
                            <div class="card-body">
                                <h5 class="card-title">${project.name}</h5>
                                <p class="card-text text-truncate">${project.url}</p>
                                ${project.description ? `<p class="card-text"><small class="text-muted">${project.description}</small></p>` : ''}
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="badge ${project.analyzed ? 'bg-success' : 'bg-secondary'}">
                                        ${project.analyzed ? 'Analyzed' : 'Not Analyzed'}
                                    </span>
                                    <small class="text-muted">${new Date(project.created_at).toLocaleDateString()}</small>
                                </div>
                            </div>
                            <div class="card-footer bg-white">
                                <a href="/project/${project.id}" class="btn btn-sm btn-primary">View</a>
                                ${!project.analyzed ? `<button class="btn btn-sm btn-success" onclick="analyzeProject(${project.id})">Analyze</button>` : ''}
                                <button class="btn btn-sm btn-danger" onclick="deleteProject(${project.id})">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function addProject() {
            const name = document.getElementById('projectName').value;
            const url = document.getElementById('projectUrl').value;
            const description = document.getElementById('projectDescription').value;

            try {
                const response = await fetchWithAuth('/api/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, url, description: description || null })
                });

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addProjectModal'));
                    modal.hide();
                    document.getElementById('addProjectForm').reset();
                    loadProjects();
                } else {
                    alert('Failed to add project');
                }
            } catch (error) {
                console.error('Error adding project:', error);
                alert('An error occurred');
            }
        }

        async function analyzeProject(projectId) {
            if (!confirm('This will analyze the website and may take a few moments. Continue?')) {
                return;
            }

            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}/analyze`, {
                    method: 'POST'
                });

                if (response.ok) {
                    alert('Project analyzed successfully!');
                    loadProjects();
                } else {
                    alert('Failed to analyze project');
                }
            } catch (error) {
                console.error('Error analyzing project:', error);
                alert('An error occurred');
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('Are you sure you want to delete this project?')) {
                return;
            }

            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadProjects();
                } else {
                    alert('Failed to delete project');
                }
            } catch (error) {
                console.error('Error deleting project:', error);
                alert('An error occurred');
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/login';
        }

        // Load data on page load
        loadUser();
        loadProjects();
    </script>
</body>
</html>
