<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Website Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .gherkin-code {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 15px;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Website Analyzer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div id="project-header" class="mb-4">
            <!-- Project header will be loaded here -->
        </div>

        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="services-tab" data-bs-toggle="tab" data-bs-target="#services" type="button" role="tab">
                    Services
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="stories-tab" data-bs-toggle="tab" data-bs-target="#stories" type="button" role="tab">
                    User Stories
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Services Tab -->
            <div class="tab-pane fade show active" id="services" role="tabpanel">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <input type="text" id="search-input" class="form-control" placeholder="Search services...">
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addServiceModal">
                            + Add Service
                        </button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Page Title</th>
                                <th>URL</th>
                                <th>Functionality</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="services-tbody">
                            <!-- Services will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div id="no-services" class="alert alert-info d-none">
                    No services found. Analyze the project or add services manually.
                </div>
            </div>

            <!-- User Stories Tab -->
            <div class="tab-pane fade" id="stories" role="tabpanel">
                <div class="mb-3 text-end">
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStoryModal">
                        + Add User Story
                    </button>
                </div>

                <div id="stories-container">
                    <!-- User stories will be loaded here -->
                </div>
                <div id="no-stories" class="alert alert-info d-none">
                    No user stories yet. Analyze the project to generate stories automatically.
                </div>
            </div>
        </div>
    </div>

    <!-- Add Service Modal -->
    <div class="modal fade" id="addServiceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Service</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addServiceForm">
                        <div class="mb-3">
                            <label for="serviceUrl" class="form-label">Page URL</label>
                            <input type="url" class="form-control" id="serviceUrl" required>
                        </div>
                        <div class="mb-3">
                            <label for="serviceTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="serviceTitle">
                        </div>
                        <div class="mb-3">
                            <label for="serviceFunctionality" class="form-label">Functionality</label>
                            <textarea class="form-control" id="serviceFunctionality" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addService()">Add Service</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Story Modal -->
    <div class="modal fade" id="addStoryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add User Story</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addStoryForm">
                        <div class="mb-3">
                            <label for="storyTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="storyTitle" required>
                        </div>
                        <div class="mb-3">
                            <label for="storyDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="storyDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="storyGherkin" class="form-label">Gherkin (Optional)</label>
                            <textarea class="form-control" id="storyGherkin" rows="5" placeholder="Feature: ...&#10;Scenario: ..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addStory()">Add Story</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Service Details Modal -->
    <div class="modal fade" id="viewServiceModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Service Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="service-details">
                    <!-- Service details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const token = localStorage.getItem('access_token');
        const projectId = {{ project_id }};
        
        if (!token) {
            window.location.href = '/login';
        }

        async function fetchWithAuth(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`
            };
            return fetch(url, options);
        }

        async function loadProject() {
            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}`);
                if (response.ok) {
                    const project = await response.json();
                    displayProjectHeader(project);
                } else {
                    alert('Project not found');
                    window.location.href = '/dashboard';
                }
            } catch (error) {
                console.error('Error loading project:', error);
            }
        }

        function displayProjectHeader(project) {
            document.getElementById('project-header').innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <h2>${project.name}</h2>
                        <p class="text-muted">${project.url}</p>
                        ${project.description ? `<p>${project.description}</p>` : ''}
                        <span class="badge ${project.analyzed ? 'bg-success' : 'bg-secondary'}">
                            ${project.analyzed ? 'Analyzed' : 'Not Analyzed'}
                        </span>
                        ${!project.analyzed ? `<button class="btn btn-sm btn-success ms-2" onclick="analyzeProject()">Analyze Now</button>` : ''}
                    </div>
                </div>
            `;
        }

        async function loadServices(searchTerm = '') {
            try {
                let url = `/api/projects/${projectId}/services`;
                if (searchTerm) {
                    url += `?search=${encodeURIComponent(searchTerm)}`;
                }
                
                const response = await fetchWithAuth(url);
                if (response.ok) {
                    const services = await response.json();
                    displayServices(services);
                } else {
                    console.error('Failed to load services');
                }
            } catch (error) {
                console.error('Error loading services:', error);
            }
        }

        function displayServices(services) {
            const tbody = document.getElementById('services-tbody');
            const noServices = document.getElementById('no-services');
            
            if (services.length === 0) {
                tbody.innerHTML = '';
                noServices.classList.remove('d-none');
            } else {
                noServices.classList.add('d-none');
                tbody.innerHTML = services.map(service => `
                    <tr>
                        <td>${service.title || 'N/A'}</td>
                        <td><a href="${service.page_url}" target="_blank" class="text-truncate d-inline-block" style="max-width: 300px;">${service.page_url}</a></td>
                        <td>${service.functionality || 'N/A'}</td>
                        <td>
                            <button class="btn btn-sm btn-info" onclick="viewServiceDetails(${service.id})">View</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteService(${service.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        async function loadUserStories() {
            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}/stories`);
                if (response.ok) {
                    const stories = await response.json();
                    displayUserStories(stories);
                } else {
                    console.error('Failed to load user stories');
                }
            } catch (error) {
                console.error('Error loading user stories:', error);
            }
        }

        function displayUserStories(stories) {
            const container = document.getElementById('stories-container');
            const noStories = document.getElementById('no-stories');
            
            if (stories.length === 0) {
                container.innerHTML = '';
                noStories.classList.remove('d-none');
            } else {
                noStories.classList.add('d-none');
                container.innerHTML = stories.map(story => `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">${story.title}</h5>
                            <p class="card-text">${story.description}</p>
                            ${story.gherkin ? `
                                <div class="mt-3">
                                    <h6>Gherkin Scenario:</h6>
                                    <div class="gherkin-code">${story.gherkin}</div>
                                </div>
                            ` : ''}
                            <small class="text-muted">Created: ${new Date(story.created_at).toLocaleDateString()}</small>
                        </div>
                    </div>
                `).join('');
            }
        }

        async function addService() {
            const page_url = document.getElementById('serviceUrl').value;
            const title = document.getElementById('serviceTitle').value;
            const functionality = document.getElementById('serviceFunctionality').value;

            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}/services`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        page_url,
                        title: title || null,
                        functionality: functionality || null
                    })
                });

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addServiceModal'));
                    modal.hide();
                    document.getElementById('addServiceForm').reset();
                    loadServices();
                } else {
                    alert('Failed to add service');
                }
            } catch (error) {
                console.error('Error adding service:', error);
                alert('An error occurred');
            }
        }

        async function deleteService(serviceId) {
            if (!confirm('Are you sure you want to delete this service?')) {
                return;
            }

            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}/services/${serviceId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadServices();
                } else {
                    alert('Failed to delete service');
                }
            } catch (error) {
                console.error('Error deleting service:', error);
                alert('An error occurred');
            }
        }

        async function viewServiceDetails(serviceId) {
            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}/services`);
                if (response.ok) {
                    const services = await response.json();
                    const service = services.find(s => s.id === serviceId);
                    if (service) {
                        const elements = service.elements ? JSON.parse(service.elements) : {};
                        document.getElementById('service-details').innerHTML = `
                            <h5>${service.title || 'No Title'}</h5>
                            <p><strong>URL:</strong> <a href="${service.page_url}" target="_blank">${service.page_url}</a></p>
                            <p><strong>Functionality:</strong> ${service.functionality || 'N/A'}</p>
                            <hr>
                            <h6>Page Elements:</h6>
                            <ul>
                                <li>Forms: ${elements.forms ? elements.forms.length : 0}</li>
                                <li>Buttons: ${elements.buttons || 0}</li>
                                <li>Tables: ${elements.tables || 0}</li>
                                <li>Images: ${elements.images || 0}</li>
                                <li>Links: ${elements.links_count || 0}</li>
                            </ul>
                        `;
                        const modal = new bootstrap.Modal(document.getElementById('viewServiceModal'));
                        modal.show();
                    }
                }
            } catch (error) {
                console.error('Error viewing service details:', error);
            }
        }

        async function addStory() {
            const title = document.getElementById('storyTitle').value;
            const description = document.getElementById('storyDescription').value;
            const gherkin = document.getElementById('storyGherkin').value;

            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}/stories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title,
                        description,
                        gherkin: gherkin || null
                    })
                });

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addStoryModal'));
                    modal.hide();
                    document.getElementById('addStoryForm').reset();
                    loadUserStories();
                } else {
                    alert('Failed to add user story');
                }
            } catch (error) {
                console.error('Error adding user story:', error);
                alert('An error occurred');
            }
        }

        async function analyzeProject() {
            if (!confirm('This will analyze the website and may take a few moments. Continue?')) {
                return;
            }

            try {
                const response = await fetchWithAuth(`/api/projects/${projectId}/analyze`, {
                    method: 'POST'
                });

                if (response.ok) {
                    alert('Project analyzed successfully!');
                    loadProject();
                    loadServices();
                    loadUserStories();
                } else {
                    alert('Failed to analyze project');
                }
            } catch (error) {
                console.error('Error analyzing project:', error);
                alert('An error occurred');
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/login';
        }

        // Search functionality
        let searchTimeout;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadServices(e.target.value);
            }, 300);
        });

        // Load data on page load
        loadProject();
        loadServices();
        loadUserStories();
    </script>
</body>
</html>
